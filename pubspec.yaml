name: musclemax
description: A comprehensive workout and fitness accountability app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Forms & Validation
  email_validator: ^2.1.17
  
  # Date & Time
  intl: ^0.19.0
  
  # Carousel
  smooth_page_indicator: ^1.1.0
  
  # Charts
  fl_chart: ^0.66.0
  image_picker: ^1.2.1
  image_cropper: ^5.0.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  
  # Animations
  confetti: ^0.7.0
  
  # URL Handling
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
