name: musclemax
description: A comprehensive workout and fitness accountability app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  video_player: ^2.7.0

  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^17.0.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Forms & Validation
  email_validator: ^3.0.0
  
  # Date & Time
  intl: ^0.20.2
  
  # Carousel
  smooth_page_indicator: ^1.1.0
  
  # Charts
  fl_chart: ^1.1.1
  
  # UUID Generator
  uuid: ^4.5.1
  
  # HTTP requests
  http: ^1.2.0
  
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  
  # Animations
  confetti: ^0.8.0
  
  # URL Handling
  url_launcher: ^6.3.1
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.4+1
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
